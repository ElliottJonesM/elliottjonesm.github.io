<!DOCTYPE html>
<html>
<head>
    <title>M109R Configurator</title>
  <script type="module" crossorigin src="/assets/index-BzVMZkfn.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-OKePZkZm.css">
</head>
<body>
  <div id="loadingOverlay">
  <div id="loadingBox">
    <div id="loadingText">Loading models...</div>
    <div id="progressBarOuter">
      <div id="progressBarInner"></div>
    </div>
    <div id="loadingPercent">0%</div>
  </div>
</div>

  <div id="viewer">


    <div id="mouseicons">
        <img src="/icons/left-clicker.png" alt="Left Click">
        <text>Rotate</text>
        <img src="/icons/right-clicker.png" alt="Right Click">
        <text>Pan</text>
        <img src="/icons/middle-mouse-roll.png" alt="Middle Mouse Roll">
        <text>Zoom</text>
    </div>

    <div id="version">
      Version 2.0.0
    </div>

    <div id="hdriPickerPanel">
      <button class="hdriButton" data-hdri="studiohdri.exr">1</button>
      <button class="hdriButton" data-hdri="studiohdri2.exr">2</button>
      <button class="hdriButton" data-hdri="studiohdri4.exr">3</button>
    </div>

    <div id="bottomViewerBar">

      <button id="resetStockButton">Reset Bike</button>

      <!-- ############## BODY ################# -->
      <div id="bodyPickerPanel">
        <label for="bodyFinishSelect">Body Finish </label>

        <input type="color" id="bodyColorPicker" value="#ffffff">

        <select id="bodyFinishSelect">
            <option value="gloss">Gloss</option>
            <option value="matte">Matte</option>
            <option value="metallicgloss" selected>Metallic Gloss</option>
        </select>

      </div>

      <!-- ############## RIMS ################# -->
      <div id="rimsPickerPanel">
        <label for="rimsFinishSelect">Rim Finish</label>

        <input type="color" id="rimsColorPicker" value="#666666">

        <select id="rimsFinishSelect">
            <option value="gloss">Gloss</option>
            <option value="matte">Matte</option>
            <option value="chrome">Chrome</option>
        </select>

      </div>
      <!-- ############## ENGINE ################# -->
      <div id="enginePickerPanel">
        <label for="engineFinishSelect">Engine Finish</label>

        <input type="color" id="engineColorPicker" value="#ffffff">

        <select id="engineFinishSelect">
            <option value="chrome">Chrome</option>
            <option value="gloss">Gloss</option>
            <option value="matte">Matte</option>
        </select>

      </div>
    </div>

  </div>

  <div id="ui">
    <div id="GripsDashTach">
        <label for="tachSelect">Tachometer</label>

        <select id="tachSelect">
          <option value="Tach_OG">Stock Tach</option>
          <option value="Tach_Nacelle">Nacelle Tach</option>
        </select>

      <label for="gripsSelect">Grips</label>

      <select id="gripsSelect">
        <option value="Grips_STOCK">Stock Grips</option>
        <option value="Grips_KURY">Kury Grips</option>
      </select>

      <label for="dashSelect">Dash</label>

      <select id="dashSelect">
        <option value="Dash_STOCK">Stock Dash</option>
        <option value="Dash_Extended">Extended Dash</option>
      </select>
    </div>

    <div id="Body">

      <label for="chinSelect">Chin</label>

      <select id="chinSelect">
        <option value="chin_STOCK">Stock Chin</option>
        <option value="chin_MEANY">Meancycles Chin</option>
      </select>

      <label for="fenderSelect">Front Fender</label>

      <select id="fenderSelect">
        <option value="FrontFender_STOCK">Stock Fender</option>
        <option value="FrontFender_STEALTH">Stealth Fender</option>
      </select>

      <label for="nacelleShroudSelect">Headlight Nacelle</label>

      <select id="nacelleShroudSelect">
        <option value="NacelleShroud_CHR">Chrome Shroud</option>
        <option value="NacelleShroud_BSCLR">Painted Shroud</option>
      </select>

    </div>

    <div id="DerbyCover">

      <label for="derbyCoverSelect">Derby Cover</label>

      <select id="derbyCoverSelect">
        <option value="DerbyCover_ALMN">Aluminum Stock</option>
        <option value="DerbyCover_3D_CHR">3D Chrome</option>
        <option value="DerbyCover_3D_BLK_GLSS">3D Black Gloss</option>
      </select>
    </div>

    <div id="Exhaust">

      <label for="exhaustSelect">Exhaust</label>

      <select id="exhaustSelect">
        <option value="Exhaust_STOCK_CHR">Stock Chrome</option>
        <option value="Exhaust_STOCK_BLK_GLSS">Stock Blk Gloss</option>
        <option value="Exhaust_STOCK_BLK_MTT">Stock Blk Matte</option>
        <option value="Exhaust_SCORPION_CHR">Scorpion Chrome</option>
        <option value="Exhaust_SCORPION_BLK_GLSS">Scorpion Blk Gloss</option>
        <option value="Exhaust_SCORPION_BLK_MTT">Scorpion Blk Matte</option>
      </select>
    </div>

    <div id="Seats">

      <label for="seatSelect">Seat</label>

      <select id="seatSelect">
        <option value="Seat_STOCK">Stock Seat</option>
        <option value="Seat_GEL">Gel Seat</option>
      </select>
    </div>

    <div id="Lights">

      <label for="brakelightSelect">Brake Light</label>
      
      <select id="brakelightSelect">
        <option value="BrakeLight_RED">Red Brake Light</option>
        <option value="BrakeLight_CLEAR">Clear Brake Light</option>
      </select>

      <label for="headlampSelect">Headlamp</label>

      <select id="headlampSelect">
        <option value="Headlamp_STOCK">Stock Headlamp</option>
        <option value="Headlamp_LED">LED Headlamp</option>
      </select>

      <label for="RearTurnSignalsSelect">Rear Turn Signals</label>
      <select id="RearTurnSignalsSelect">
        <option value="RearTurnSignals_STOCK">Stock</option>
        <option value="RearTurnSignals_RAW">Raw Design</option>
      </select>
    </div>

    <div id="Mirrors">

      <label for="mirrorsSelect">Mirrors</label>
      
      <select id="mirrorsSelect">
        <option value="Mirrors_STOCK">Stock Mirrors</option>
        <option value="Mirrors_KURYMAG">Kuryakyn Magnum Mirrors</option>
      </select>
    </div>

    <div id="Decals">
      
      <label id="decalsHeader">DECALS</label>

      <button id="showBadgesStock">Toggle Stock Badges</button>
      <button id="showStickers_Fender">Toggle Side Fenders</button>
      <button id="showStickers_Rear">Toggle Rear Sticker</button>
    </div>
  </div>

</body>
</html>
